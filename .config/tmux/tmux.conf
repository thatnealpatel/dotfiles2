# tmux.conf. Prefix is the default C-b.
#   |  /  -        split right / down
#   h j k l        move between panes
#   r              reload this file
#   w              window picker, no previews
#   C-s / C-r      save / restore session (tmux-resurrect)

# --- terminal
# Pass the outer $TERM through. See https://github.com/tmux/tmux/wiki/FAQ
set -g default-terminal $TERM
set -g focus-events on        # lets editors and agents notice focus changes
set -g mouse on
set -g history-limit 100000
set -g allow-rename on        # let shells rename windows

# --- PaperColor
BG1="#005f87"
BG2="#e4e4e4"
BG3="#0087af"
FG1="#444444"

set -g status off
set -g status-position bottom
set -g status-style bg=$BG1,fg=$FG1
set -g window-status-current-style bg=$BG2,fg=$BG1
set -g window-status-bell-style fg=colour229,bg=colour88
set -g pane-border-style fg=$BG3
set -g pane-active-border-style fg=$BG3
set -g message-style fg=red,bg=default,bold
set -g message-command-style bg=$BG1,fg=$FG1
set -g clock-mode-colour colour24
set -g mode-style fg=black,bg=yellow,bold

# --- windows and panes
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# window picker without zoom or pane previews. The default -Z resizes every
# pane on the way in and out, and the previews capture every pane; both crawl
# over ssh. The tree draws inside the current pane instead.
bind w choose-tree -wN

# --- plugins, cloned by .bootstrap/stages/20-tmux.sh
run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux
